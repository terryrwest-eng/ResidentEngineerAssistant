apply plugin: 'com.android.application'

android {
    namespace "com.redailyreporter.app"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.redailyreporter.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Sign debug builds with a keystore kept in the repository, rather than
    // whatever key happens to be on the machine doing the build.
    //
    // WHY: Android refuses to install an update signed by a different key than
    // the installed copy. By default Gradle uses ~/.android/debug.keystore,
    // which is generated per machine — so an APK from a laptop and one from a
    // CI runner are signed by different keys and cannot replace each other. The
    // install fails, sometimes with no more than a toast, and the old version
    // stays put looking like a build that did not take effect.
    //
    // A shared key makes every build interchangeable: install over the top from
    // any source and it just works.
    //
    // Committing a signing key is normally wrong. This one is a DEBUG key with
    // the conventional public password — it grants nothing. It cannot sign a
    // Play Store release, and it is not what protects the app; the server does
    // that, and every route there requires a signed-in user. If this app is
    // ever published, that needs a real release key from repository secrets,
    // which is a different job from this one.
    signingConfigs {
        debug {
            storeFile file('../debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }

        // Release signing, read from ../keystore.properties, which is NOT in
        // the repo. Anyone holding the keystore AND its password can ship an
        // update that Android accepts as this app, so the two never get
        // committed - see .gitignore.
        //
        // Guarded because a checkout without the keystore must still be able
        // to build a debug APK. Without the guard, cloning the repo and
        // running any gradle task fails on a missing file.
        release {
            def props = new Properties()
            def propsFile = rootProject.file('keystore.properties')
            if (propsFile.exists()) {
                props.load(new FileInputStream(propsFile))
                storeFile rootProject.file(props['storeFile'])
                storePassword props['storePassword']
                keyAlias props['keyAlias']
                keyPassword props['keyPassword']
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Left off deliberately. R8 strips what it cannot see being used,
            // and Capacitor reaches its plugins by reflection from JavaScript -
            // which it cannot see. Turning this on silently breaks plugins at
            // runtime, not at build time.
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'

            // A release build is NOT debuggable. That is the whole point of
            // moving off the debug key: a debuggable APK lets anyone with USB
            // access read the app's memory and local storage, on a phone that
            // goes to job sites.
            signingConfig rootProject.file('keystore.properties').exists()
                    ? signingConfigs.release
                    : null
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
