<!--
  Daily Reporter — browser tab icon.

  The same length of pipe as the Android launcher icon, in the same amber on
  the same slate, so a pinned tab and a home screen shortcut are recognisably
  the same app. Geometry mirrors scripts/make_app_icon.py; change one and
  change the other.

  SVG rotates clockwise for a positive angle and Pillow rotates the other way,
  which is why this is -27 where the generator says 27.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="108" height="108">
  <rect width="108" height="108" rx="24" fill="#132A3E"/>
  <g transform="rotate(-27 54 54)">
    <!-- far end, drawn first so the body covers the join -->
    <ellipse cx="87" cy="54" rx="9" ry="17" fill="#C97205"/>
    <rect x="21" y="37" width="66" height="34" fill="#F59E0B"/>
    <!-- underside: a light direction, so it is a cylinder and not a flat bar -->
    <rect x="21" y="65.5" width="66" height="5.5" fill="#C97205"/>
    <!-- near end: the wall, then the bore through it -->
    <ellipse cx="21" cy="54" rx="9" ry="17" fill="#F59E0B"/>
    <ellipse cx="21" cy="54" rx="5" ry="10.5" fill="#0C1C2A"/>
  </g>
</svg>
