<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 320px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: #fff;
    }

    h1 {
      margin: 0 0 16px 0;
      font-size: 18px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status {
      padding: 8px 12px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 13px;
    }

    .status.connected {
      background: rgba(46, 213, 115, 0.2);
      border: 1px solid #2ed573;
    }

    .status.disconnected {
      background: rgba(255, 71, 87, 0.2);
      border: 1px solid #ff4757;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 8px;
      transition: all 0.2s;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    .btn-danger {
      background: linear-gradient(135deg, #ff4757 0%, #c0392b 100%);
      color: white;
    }

    .btn-danger:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(255, 71, 87, 0.4);
    }

    .info {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.5);
      margin-top: 12px;
      text-align: center;
    }

    .row-count {
      font-size: 24px;
      font-weight: bold;
      text-align: center;
      margin: 16px 0;
      color: #667eea;
    }
  </style>
</head>

<body>
  <h1>🚀 PMWeb Auto-Fill</h1>

  <div id="status" class="status disconnected">
    Checking connection...
  </div>

  <div id="rowCountContainer"
    style="display:none; margin: 16px 0; background: rgba(255, 193, 7, 0.1); border: 1px solid #ffc107; padding: 12px; border-radius: 8px;">
    <div style="text-align: center; color: #ffc107; font-weight: bold; font-size: 14px; margin-bottom: 4px;">Attention
      Required</div>
    <div id="rowCountMsg" style="text-align: center; font-size: 13px; color: #fff;"></div>
  </div>

  <button id="fetchBtn" class="btn btn-secondary" onclick="fetchData()">
    📥 Fetch Data from App
  </button>

  <button id="fillBtn" class="btn btn-primary" onclick="fillPMWeb()" disabled>
    ⚡ Fill PMWeb Rows
  </button>

  <button id="clearBtn" class="btn btn-danger" onclick="clearPMWeb()">
    🗑️ Clear All Data
  </button>

  <!-- Activities Section -->
  <div style="margin-top: 16px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,0.15);">
    <div style="font-size: 13px; font-weight: 600; color: #ffc107; margin-bottom: 8px;">📋 PMWeb Activities (OnSite)</div>

    <div id="actRowCountContainer"
      style="display:none; margin: 8px 0; background: rgba(255, 193, 7, 0.1); border: 1px solid #ffc107; padding: 10px; border-radius: 8px;">
      <div id="actRowCountMsg" style="text-align: center; font-size: 13px; color: #fff;"></div>
    </div>

    <button id="fetchActBtn" class="btn btn-secondary">
      📥 Fetch Activities
    </button>

    <button id="fillActBtn" class="btn btn-primary" disabled>
      ⚡ Fill Activities
    </button>
  </div>

  <div class="info">
    Make sure your Daily Reporting App is running locally
  </div>

  <script src="popup.js"></script>
</body>

</html>
